<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b101b">
  <title>{% block title %}Home{% endblock %} · {{ branding.site_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body style="--mint: {{ accent_color }}">
  <div class="site-shell">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="{{ branding.site_title }} home"><span class="brand-mark">{{ branding.site_title[0]|upper }}</span><span class="brand-title">{{ branding.site_title }}</span></a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="/" {% if active == 'home' %}aria-current="page"{% endif %}>Home</a>
          <a href="/ui/games" {% if active == 'play' %}aria-current="page"{% endif %}>Play</a>
          <a href="/ui/sessions" {% if active == 'sessions' %}aria-current="page"{% endif %}>Sessions</a>
          <a href="/ui/create-game" {% if active == 'create' %}aria-current="page"{% endif %}>Create</a>
          <a href="/ui/config" {% if active == 'config' %}aria-current="page"{% endif %}>Settings</a>
        </nav>
      </div>
    </header>
    <main class="content" id="main-content">{% block content %}{% endblock %}</main>
    <footer class="footer"><span>{{ branding.site_title }}</span><span>Game night control · <a href="/docs">API docs</a></span></footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
