{% extends 'base.html' %}
{% block title %}Confirm action{% endblock %}
{% block content %}
<div class="confirm-wrap"><p class="eyebrow">CONFIRM ACTION</p><h1>{{ heading }}</h1><p class="subline">{{ description }}</p><div class="button-row"><form method="post" action="{{ action }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit" class="button button-danger">{{ button_text }}</button></form><a class="button button-outline" href="{{ cancel_url }}">Cancel</a></div></div>
{% endblock %}
